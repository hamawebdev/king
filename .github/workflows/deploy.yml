name: Deploy to GitHub Pages

on:
  push:
    branches: [redesign/premium-brand]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The site is served from https://<owner>.github.io/<repo>/, so assets and routes need that base.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Single-page app: Pages serves 404.html for unknown paths, so deep links (/pricing/, /produit/…) load the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
