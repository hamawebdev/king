name: Deploy to GitHub Pages

on:
  push:
    branches: [redesign/premium-brand]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The site is served from https://<owner>.github.io/<repo>/, so assets and routes need that base.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Single-page app on static hosting: every real route gets its own index.html (served with HTTP 200), and
      # 404.html serves anything else, which the app renders as its 404 page. Keep the list in sync with App.tsx.
      - name: Route entry pages
        run: |
          cp dist/index.html dist/404.html
          for route in pricing services muffin-builder-83 contact checkout \
            conditions-dutilisation conditions-generales-de-vente politique-de-confidentialite politique-de-remboursement \
            produit/abonnement-3-mois produit/abonnement-6-mois produit/abonnement-12-mois \
            produit/abonnement-12-mois-seul-acces produit/abonnement-24-mois produit/renouvellement-12-mois; do
            mkdir -p "dist/$route" && cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
